name: passe-backend-audit

services:
  db:
    image: mysql:8.0.46
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_ci"]
    environment:
      MYSQL_DATABASE: passedb
      MYSQL_ROOT_PASSWORD: audit_root_local
      MYSQL_USER: passe_app
      MYSQL_PASSWORD: passe_app_local
      MYSQL_TEST_USER: passe_test
      MYSQL_TEST_PASSWORD: passe_test_local
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:13307:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./backend/scripts/docker-init.sh:/docker-entrypoint-initdb.d/01-tests.sh:ro
      - ./backend/scripts:/opt/passe-sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database=passedb --execute="SELECT 1" > /dev/null']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/passedb
      DB_USERNAME: passe_app
      DB_PASSWORD: passe_app_local
      CORS_ORIGIN: http://localhost:5173
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: [tools]
    build:
      context: ./backend
      target: tests
    environment:
      DB_URL: jdbc:mysql://db:3306/passedb
      TEST_DB_URL: jdbc:mysql://db:3306/passedb_test
      DB_USERNAME: passe_app
      DB_PASSWORD: passe_app_local
      TEST_DB_USERNAME: passe_test
      TEST_DB_PASSWORD: passe_test_local
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
