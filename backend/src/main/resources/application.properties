spring.application.name=PasseBackend
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/passedb}
spring.datasource.username=${DB_USERNAME:passe_app}
spring.datasource.password=${DB_PASSWORD:passe_app_local}

spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'
spring.jpa.open-in-view=false

spring.sql.init.mode=never

server.error.include-stacktrace=never

server.error.include-exception=false
server.error.include-message=always
